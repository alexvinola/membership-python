<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Verify your email</title></head>
<body style="font-family:sans-serif;max-width:600px;margin:auto;padding:24px">
  <h2>Verify your email address</h2>
  <p>Click the button below to verify your email. This link expires in 24 hours.</p>
  <a href="{{ token }}"
     style="display:inline-block;padding:12px 24px;background:#4f46e5;color:#fff;text-decoration:none;border-radius:6px">
    Verify email
  </a>
  <p style="margin-top:24px;color:#6b7280;font-size:12px">
    If you did not create an account, you can safely ignore this email.
  </p>
</body>
</html>
